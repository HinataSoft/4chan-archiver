services:
  app:
    build: .
    environment:
      DATA_DIR: /data
      LOG_LEVEL: INFO
    volumes:
      - archive:/data
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATA_DIR: /data
      LOG_LEVEL: INFO
      API_RATE: "1"
      MEDIA_RATE: "4"
    volumes:
      - archive:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./static:/srv/static:ro
      - archive:/data:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  archive:
