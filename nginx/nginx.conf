server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    auth_basic "4chan archiv";
    auth_basic_user_file /etc/nginx/htpasswd;

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # thread.json se přepisuje při každém pollu, immutable by živý thread
    # zmrazil na rok. Regex location má přednost před prefixem /archive/.
    location ~ ^/archive/(?<archived_json>[^/]+/[0-9]+/thread\.json)$ {
        alias /data/archive/$archived_json;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    location /archive/ {
        alias /data/archive/;
        autoindex off;
        # Média jsou pojmenovaná podle neměnného `tim`, obsah se nikdy nemění.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Bajty pod /archive/ dodal 4chan, ne my, a servírují se z vlastního
        # originu aplikace. Neznámá přípona tedy padá na octet-stream a nosniff
        # brání prohlížeči domýšlet si typ — lepší než rozšiřovat `types`
        # o každou možnou příponu.
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff";
        types {
            application/json json;
            image/jpeg       jpg jpeg;
            image/png        png;
            image/gif        gif;
            image/webp       webp;
            video/webm       webm;
            video/mp4        mp4;
        }
    }

    location = /archive/ { return 404; }

    location / {
        root /srv/static;
        try_files $uri $uri/ =404;
    }
}
