<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rules — 4chan archive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Automatic download rules</h1>
  <nav><a href="./">Threads</a><a href="rules.html">Rules</a><a href="archive.html">Archive</a></nav>

  <div class="panel">
    <form class="row" id="add-form">
      <input type="text" id="board" placeholder="board (e.g. g)" size="8" required>
      <input type="text" id="keywords"
             placeholder="comma-separated keywords" required>
      <button type="submit">Add rule</button>
    </form>
    <div class="error" id="add-error"></div>
    <p>A thread is queued when one of the keywords appears in its subject
       or in the text of the first post (case-insensitive).</p>
  </div>

  <table>
    <thead><tr>
      <th>Board</th><th>Keywords</th><th>Enabled</th>
      <th>Last scan</th><th>Error</th><th></th>
    </tr></thead>
    <tbody id="rules"></tbody>
  </table>

  <script type="module" src="js/rules.js"></script>
</body>
</html>
