<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4chan archive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>4chan archive</h1>
  <nav><a href="./">Threads</a><a href="rules.html">Rules</a></nav>

  <div class="panel stats" id="stats">loading…</div>

  <div class="panel">
    <form class="row" id="add-form">
      <input type="text" id="url" placeholder="https://boards.4chan.org/g/thread/12345678"
             autocomplete="off" required>
      <button type="submit">Download</button>
    </form>
    <div class="error" id="add-error"></div>
  </div>

  <div class="panel row">
    <input type="text" id="filter-q" placeholder="search subject">
    <select id="filter-status">
      <option value="">all statuses</option>
      <option value="live">live</option>
      <option value="dead">dead</option>
      <option value="error">error</option>
      <option value="disabled">disabled</option>
    </select>
    <button id="refresh">Refresh</button>
  </div>

  <table>
    <thead><tr>
      <th>Board</th><th>Thread</th><th>Subject</th><th>Posts</th><th></th>
    </tr></thead>
    <tbody id="threads"></tbody>
  </table>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
